# Read the Docs configuration. Required by RTD as of Sept 2023; without
# this file the platform falls back to a deprecated default and may fail
# to install autodoc dependencies. See docs/ for the Sphinx project.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - full
