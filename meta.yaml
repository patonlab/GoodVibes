{% set name = "goodvibes" %}
{% set version = "4.4.0" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0573b547f97b038ef87ef69871d41019b5e8dc7c7c4a2907ed18ebefed602160

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv "

requirements:
  host:
    - pip
    - python
  run:
    - numpy <3
    - pymsym  # [not win]
    - rich >=13.0
    - python >=3.9

test:
  imports:
    - goodvibes

about:
  home: https://github.com/patonlab/goodvibes
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt 
  summary: Calculates quasi-harmonic free energies from frequency calculations with temperature and entropic corrections
  doc_url: 
  dev_url: 

extra:
  recipe-maintainers:
    - bobbypaton
