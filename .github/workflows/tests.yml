name: Tests

on:
  push:
    branches: [master, testing]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (Pyflakes + syntax errors)
        run: ruff check goodvibes/ tests/

  test:
    runs-on: ${{ matrix.os }}
    # Run Python in UTF-8 mode everywhere so the test harness decodes the
    # subprocess stdout (Rich tables, ✔, ΔΔG) consistently. Windows otherwise
    # defaults stdio to cp1252; GoodVibes itself also self-reconfigures to
    # UTF-8 at runtime so real users aren't reliant on this (issue #102).
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        # Windows smoke job: catches the pymsym install-marker behavior and any
        # path/encoding regressions (issue #102). pymsym has no Windows wheels,
        # so the dependency marker skips it there and GoodVibes degrades gracefully.
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest -v --cov=goodvibes --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
