[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "goodvibes"
version = "4.4.0"
description = "A python program to compute corrections to thermochemical data from frequency calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "Paton Research Group", email = "patonlab@colostate.edu" },
]
keywords = ["compchem", "thermochemistry", "gaussian", "vibrational-entropies", "temperature"]
dependencies = [
    "numpy<3",
    # pymsym powers the optional --symm symmetry detection but has no Windows
    # wheels (issue #102), so it is required only off-Windows. On Windows it can
    # be installed manually; GoodVibes degrades gracefully when it is absent.
    "pymsym; platform_system != 'Windows'",
    "rich>=13.0",
    # reaction-profile documents and PES files are YAML (4.6+: a core dependency)
    "pyyaml",
]

[project.optional-dependencies]
ase = ["ase>=3.22"]
plot = ["matplotlib>=3.5"]
full = ["ase>=3.22", "pyyaml", "pandas", "pyarrow", "matplotlib>=3.5"]
test = ["pytest", "pytest-cov", "ase>=3.22", "pyyaml", "pandas", "pyarrow", "matplotlib>=3.5", "jsonschema>=4"]
# the reaction-profile figure tools (goodvibes-profile plot)
profile = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/patonlab/goodvibes"

[project.scripts]
goodvibes = "goodvibes.GoodVibes:main"
goodvibes-profile = "goodvibes.profile_cli:main"

[tool.setuptools]
packages = ["goodvibes"]
# Ship only the files listed under package-data; never sweep in everything
# an SCM plugin or a stale egg-info SOURCES.txt happens to list.
include-package-data = false

[tool.setuptools.package-data]
# Only the data files the code reads at runtime. The example outputs under
# goodvibes/examples/ (~280 MB, mostly the PES conformer set) stay in the git
# repository for the README walkthrough and the test suite, but are not
# shipped in the wheel/sdist: they made every install ~70 MB.
goodvibes = ["scaling_factors.json", "solvents.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GoodVibes' own code must not use its deprecated constructor: a
# "Calling calc_bbe(...) directly is deprecated" warning attributed to a
# goodvibes module is an error. Tests that call the legacy form on purpose
# are attributed to the test module and are unaffected.
filterwarnings = [
    "error:Calling calc_bbe:DeprecationWarning:goodvibes",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Minimal, high-signal ruleset enforced in CI: Pyflakes (real bugs —
# undefined names, unused imports/variables) plus syntax errors.
# Style rules (E, W, I, UP) can be ratcheted up later.
select = ["F", "E9"]
